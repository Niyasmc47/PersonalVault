spring.application.name=personalvault

spring.config.import=optional:file:.env[.properties]

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/personalvault
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
# Expiration time in milliseconds (e.g., 24 hours = 86400000)
jwt.expiration=86400000

# OAuth2 Google Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:placeholder}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:placeholder}
spring.security.oauth2.client.registration.google.scope=profile, email
app.frontend.url=${VITE_API_URL:http://localhost:5173}

# Multipart File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Certificates & Google Drive Configuration
app.certificates.max-file-size=${MAX_CERTIFICATE_FILE_SIZE:20971520}
google.drive.scope=https://www.googleapis.com/auth/drive.file
google.drive.redirect-uri=${GOOGLE_DRIVE_REDIRECT_URI:http://localhost:8080/api/integrations/google-drive/callback}

# Secure Vault Configuration
app.vault.encryption-key=${VAULT_ENCRYPTION_KEY:personalvault-secure-vault-encryption-secret-key-2026}
app.vault.session-expiration-minutes=${VAULT_SESSION_EXPIRATION_MINUTES:15}

